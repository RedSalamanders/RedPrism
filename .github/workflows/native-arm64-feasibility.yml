name: Native ARM64 Release feasibility
on:
  push:
    branches:
      - codex/p1-opacity-host-proof
    paths:
      - .github/workflows/native-arm64-feasibility.yml
      - .github/scripts/Run-NativeArm64.ps1
  workflow_dispatch:
    inputs:
      configuration:
        description: "Single-profile feasibility run; expand only after review"
        type: choice
        required: true
        options:
          - Release
permissions:
  contents: read
concurrency:
  group: native-arm64-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-arm64-release:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/codex/p1-opacity-host-proof' &&
       contains(github.event.head_commit.message, '[arm64-validation]')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/codex/p1-opacity-host-proof' &&
       inputs.configuration == 'Release')
    name: Native ARM64 Release feasibility
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 180
    steps:
      - name: Check out selected source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare required MSVC 14.52 tools
        uses: ./.github/actions/setup-msvc
        with:
          platform: ARM64
      - name: Run canonical ARM64 test entrypoint
        shell: pwsh
        env:
          REDPRISM_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: ./.github/scripts/Run-NativeArm64.ps1
      - name: Upload native ARM64 evidence (including failures)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redprism-native-arm64-Release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            .build/native-arm-ci/**
            .build/logs/**
            .build/ARM64/Release/**
            .build/Intermediate/ARM64/Release/**
            .build/dependencies/DxUi/*.json
            .build/dependencies/DxUi/*.props
            .build/dependencies/DxUi/*/DxUi.build-identity.json
            .build/dependencies/DxUi/*/ARM64/Release/DxUi.lib
            .build/dependencies/DxUi/*/ARM64/Release/DxUi.pdb
            .build/screenshots/**
            !.build/**/*.dmp

