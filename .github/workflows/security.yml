name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@476d3fafeb67f70cda37f6f00195e42c53936e19
    with:
      engine_ref: 476d3fafeb67f70cda37f6f00195e42c53936e19
