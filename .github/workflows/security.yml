name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@abb9c5ebe60e1acd3b41ce8dcbb3881aa8de9a4e
    with:
      engine_ref: abb9c5ebe60e1acd3b41ce8dcbb3881aa8de9a4e
