name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@4881ecbb2e4fdc69c4fcdb264d77890f71ef9351
    with:
      engine_ref: 4881ecbb2e4fdc69c4fcdb264d77890f71ef9351
